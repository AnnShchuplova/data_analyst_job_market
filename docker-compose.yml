# Two-service deployment:
#   web    — public Streamlit dashboard (reads processed CSVs, read-only).
#   parser — private hh.ru collector + cleaner, cron-driven, no ports.
#
# Data flows: parser writes to ./finaldata/ (bind mount) -> web reads same dir.
# Using a bind mount means existing local CSVs are immediately available on
# first boot without needing to run the parser first.

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: analyst-market-web:latest
    container_name: analyst-market-web
    ports:
      - "8501:8501"
    volumes:
      # Bind mount: existing local CSVs are visible immediately on first boot.
      # VacanciesRepository and clusters.py both look in finaldata/ at runtime.
      - ./finaldata:/app/finaldata:ro
      # Clustering cache is web-owned; parser must never touch it.
      - cache_data:/app/data/cache
      # Bind mount: models trained inside Docker are saved directly to ./models/
      # on the host, so they survive rebuilds and are version-consistent.
      - ./models:/app/models
    env_file: .env
    restart: unless-stopped
    depends_on:
      - parser

  parser:
    build:
      context: .
      dockerfile: docker/parser.Dockerfile
    image: analyst-market-parser:latest
    container_name: analyst-market-parser
    volumes:
      # Raw JSONs stay private to parser — web has no business reading them.
      - raw_data:/app/data/raw
      # Same bind mount: parser writes new CSVs here, web picks them up automatically.
      - ./finaldata:/app/finaldata
    env_file: .env
    restart: unless-stopped
    # Deliberately no `ports:` — this service must not be reachable externally.

volumes:
  raw_data:
  cache_data:
